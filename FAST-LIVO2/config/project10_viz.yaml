# Project_job10 全量运行 + PCD 地图保存（效果可视化用）
common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.023, -0.011, 0.044]
  extrinsic_R: [0.941308, -0.005359, -0.337508,
                -0.005359, 0.999511, -0.030819,
                0.337508, 0.030819, 0.940818]
  Rcl: [-0.015481, 0.320653, 0.947070,
        -0.999879, -0.003855, -0.015038,
        -0.001171, -0.947189, 0.320674]
  Pcl: [0.124473, 0.009503, 0.060680]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1
  scan_line: 1
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "project10_viz"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: 25

image_save:
  img_save_en: false
  interval: 1
